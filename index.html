<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Administracion de Sintéticas</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <header>
    <h1>Gestion de Canchas Sinteticas</h1>
    <p id="mensaje" class="mensaje oculto"></p>
    <p>Proyecto frontend y backend</p>
  </header>

  <main>
    <section id="sinteticas">
      <h2>Listado</h2>
      <ul id="lista-sinteticas"></ul>
    </section>

    <section id="formulario">
      <h2>Nueva Sintética</h2>

      <form id="form-sintetica">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          placeholder="Ej: Sintética Cancha 1"
          required
        />

        <button type="submit">Agregar</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
